name: Apply task 6.14 v2

on:
  push:
    branches:
      - chatgpt-6-14

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply 6.14 source changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def sub1(text, pattern, replacement, label, flags=0):
              result, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, got {count}")
              return result

          def rep1(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"{label}: text not found")
              return text.replace(old, new, 1)

          # ================================================================
          # floorStructureConstants.js
          # ================================================================
          p = Path("src/floorStructureConstants.js")
          s = p.read_text(encoding="utf-8")

          defs = '''export const STEEL_GRATING_PROFILES = [
            { id: "SP_34x38_25x3", name: "SP 34×38 / 25×3", height: 25, barThickness: 3, gratingWeight: 23 },
            { id: "SP_34x38_30x2", name: "SP 34×38 / 30×2", height: 30, barThickness: 2, gratingWeight: 20 },
            { id: "SP_34x38_30x3", name: "SP 34×38 / 30×3", height: 30, barThickness: 3, gratingWeight: 27 },
            { id: "SP_34x38_35x3", name: "SP 34×38 / 35×3", height: 35, barThickness: 3, gratingWeight: 31 },
            { id: "SP_34x38_40x3", name: "SP 34×38 / 40×3", height: 40, barThickness: 3, gratingWeight: 35 },
            { id: "SP_34x38_40x4", name: "SP 34×38 / 40×4", height: 40, barThickness: 4, gratingWeight: 47 },
          ];

          export const DEFAULT_STEEL_GRATING_PROFILE_ID = "SP_34x38_35x3";
          export const KNAUF_FILL_DENSITY_PRESETS = [400, 600, 800];
          export const DEFAULT_KNAUF_FILL_DENSITY = 600;

          export function normalizeKnaufFillDensity(value) {
            const density = Number(value);
            return KNAUF_FILL_DENSITY_PRESETS.includes(density)
              ? density
              : DEFAULT_KNAUF_FILL_DENSITY;
          }

          export function getSteelGratingProfile(profileId) {
            return (
              STEEL_GRATING_PROFILES.find((profile) => profile.id === profileId) ||
              STEEL_GRATING_PROFILES.find((profile) => profile.id === DEFAULT_STEEL_GRATING_PROFILE_ID)
            );
          }

          '''
          s = rep1(s, 'export const FLOOR_TYPES = [', defs + 'export const FLOOR_TYPES = [', 'insert constants')

          steel_obj = '''  {
            id: "steel_grating",
            name: "Сварной решетчатый настил SP 34×38 по стальным балкам",
            shortName: "Решётчатый настил SP",
            category: "steel",
            standard: "ГОСТ 23120-2016",
            defaultThickness: 35,
            thicknessRange: [25, 40],
            thicknessPresets: [25, 30, 35, 40],
            isConstantThickness: false,
            deadLoad: 53, // кг/м²: SP 34×38 / 35×3 (31) + второстепенные балки (22)
            beamSpacing: "1.0 – 1.8 м",
            fireRating: "R 15 (требуется конструктивная огнезащита)",
            features:
              "Промышленное перекрытие на сварном решетчатом настиле SP. Масса настила определяется выбранным стандартным профилем, а не условной толщиной листа.",
            color: "#059669",
            layers: [
              { name: "Решётчатый настил SP 34×38 / 35×3", thickness: 35, weight: 31 },
              { name: "Второстепенные прогоны из швеллера / профильной трубы", thickness: 120, weight: 22 },
            ],
          },
          {
            id: "timber_deck"'''
          s = sub1(
              s,
              r'  \{\n    id: "steel_grating",.*?\n  \},\n  \{\n    id: "timber_deck"',
              steel_obj,
              'steel FLOOR_TYPES object',
              re.S,
          )

          knauf_obj = '''  {
            id: "knauf_dry_floor",
            name: "Сборная сухая стяжка по профлисту (KNAUF Суперпол / ГВЛВ)",
            shortName: "Сухая стяжка KNAUF",
            category: "dry_screed",
            standard: "СП 29.13330.2011, Серия 1.031.9-2.07",
            defaultThickness: 70,
            thicknessRange: [50, 500],
            thicknessPresets: [50, 60, 70, 80, 100],
            isConstantThickness: false,
            deadLoad: 72, // кг/м² при t=70 мм и расчетной плотности засыпки 600 кг/м³
            beamSpacing: "1.5 – 2.5 м",
            fireRating: "REI 45",
            features:
              "Монтаж без бетонных работ: элемент пола KNAUF 20 мм, сухая засыпка с задаваемой расчетной плотностью и несущий профнастил.",
            color: "#7c3aed",
            layers: [
              { name: "Элементы пола КНАУФ Суперпол (ГВЛВ 20 мм)", thickness: 20, weight: 24 },
              { name: "Сухая засыпка (50 мм, 600 кг/м³)", thickness: 50, weight: 30 },
              { name: "Несущий профилированный лист Н57/Н75", thickness: 75, weight: 18 },
            ],
          },
          ];'''
          s = sub1(
              s,
              r'  \{\n    id: "knauf_dry_floor",.*?\n  \},\n\];',
              knauf_obj,
              'KNAUF FLOOR_TYPES object',
              re.S,
          )

          s = rep1(
              s,
              '  deckProfile: "Н75-750-0.8",\n  storyElevations: null,',
              '  deckProfile: "Н75-750-0.8",\n  knaufFillDensity: DEFAULT_KNAUF_FILL_DENSITY,\n  gratingProfileId: DEFAULT_STEEL_GRATING_PROFILE_ID,\n  gratingProfileName: getSteelGratingProfile(DEFAULT_STEEL_GRATING_PROFILE_ID).name,\n  gratingWeight: getSteelGratingProfile(DEFAULT_STEEL_GRATING_PROFILE_ID).gratingWeight,\n  storyElevations: null,',
              'DEFAULT_FLOOR_STRUCTURE fields',
          )

          s = rep1(
              s,
              'export function calculateStructuralDeadLoadForType(typeId, t) {\n  const thick = Number(t) || 120;\n  if (typeId === "monolithic_deck") {\n    return getMonolithicDeckStructuralComponents(thick).structuralDeadLoad;\n  }\n  return calculateDeadLoadForType(typeId, thick, 0);\n}',
              'export function calculateStructuralDeadLoadForType(typeId, t, options = {}) {\n  const thick = Number(t) || 120;\n  if (typeId === "monolithic_deck") {\n    return getMonolithicDeckStructuralComponents(thick).structuralDeadLoad;\n  }\n  return calculateDeadLoadForType(typeId, thick, 0, options);\n}',
              'structural helper signature',
          )
          s = rep1(s, 'export function calculateDeadLoadForType(typeId, t, floorFinishLoad) {', 'export function calculateDeadLoadForType(typeId, t, floorFinishLoad, options = {}) {', 'dead-load signature')

          s = sub1(
              s,
              r'    case "steel_grating":\n.*?    case "timber_deck":',
              '''    case "steel_grating": {
                const profile = getSteelGratingProfile(options?.gratingProfileId);
                return Math.round((profile.gratingWeight + 22) * 1000) / 1000;
              }
              case "timber_deck":''',
              'steel formula',
              re.S,
          )
          s = sub1(
              s,
              r'    case "knauf_dry_floor":\n.*?    default:',
              '''    case "knauf_dry_floor": {
                const density = normalizeKnaufFillDensity(options?.knaufFillDensity);
                const backfillHeightMm = Math.max(0, thick - 20);
                const backfillLoad = (backfillHeightMm / 1000) * density;
                return Math.round((24 + 18 + backfillLoad) * 1000) / 1000;
              }
              default:''',
              'KNAUF formula',
              re.S,
          )
          s = rep1(s, 'export function getLayersForTypeAndThickness(typeInfo, t) {', 'export function getLayersForTypeAndThickness(typeInfo, t, options = {}) {', 'layers signature')

          s = sub1(
              s,
              r'  if \(typeInfo\.id === "steel_grating"\) \{.*?\n  \}\n\n  if \(typeInfo\.id === "precast_block_composite"\)',
              '''  if (typeInfo.id === "steel_grating") {
                const profile = getSteelGratingProfile(options?.gratingProfileId);
                return [
                  {
                    name: `Решётчатый настил ${profile.name}`,
                    thickness: profile.height,
                    weight: profile.gratingWeight,
                    highlight: true,
                  },
                  {
                    name: "Второстепенные прогоны из швеллера / профильной трубы",
                    thickness: 120,
                    weight: 22,
                  },
                ];
              }

              if (typeInfo.id === "precast_block_composite")''',
              'steel layers',
              re.S,
          )
          s = sub1(
              s,
              r'  if \(typeInfo\.id === "knauf_dry_floor"\) \{.*?\n  \}\n\n  return typeInfo\.layers \|\| \[\];',
              '''  if (typeInfo.id === "knauf_dry_floor") {
                const density = normalizeKnaufFillDensity(options?.knaufFillDensity);
                const backfillH = Math.max(0, thick - 20);
                const backfillWeight = Math.round(((backfillH / 1000) * density) * 1000) / 1000;
                return [
                  {
                    name: "Сборные гипсоволокнистые элементы пола KNAUF КНАУФ-суперпол (20 мм)",
                    thickness: 20,
                    weight: 24,
                  },
                  {
                    name: `Сухая засыпка (${backfillH} мм, ${density} кг/м³)`,
                    thickness: backfillH,
                    weight: backfillWeight,
                    highlight: true,
                  },
                  {
                    name: "Несущий профлист Н57/Н75",
                    thickness: 75,
                    weight: 18,
                  },
                ];
              }

              return typeInfo.layers || [];''',
              'KNAUF layers',
              re.S,
          )
          p.write_text(s, encoding="utf-8")

          # ================================================================
          # FloorStructureModal.js
          # ================================================================
          p = Path("src/FloorStructureModal.js")
          s = p.read_text(encoding="utf-8")

          s = rep1(
              s,
              '  FLOOR_TYPES,\n  LIVE_LOAD_PRESETS,',
              '  FLOOR_TYPES,\n  STEEL_GRATING_PROFILES,\n  DEFAULT_STEEL_GRATING_PROFILE_ID,\n  KNAUF_FILL_DENSITY_PRESETS,\n  DEFAULT_KNAUF_FILL_DENSITY,\n  normalizeKnaufFillDensity,\n  getSteelGratingProfile,\n  LIVE_LOAD_PRESETS,',
              'imports',
          )
          s = rep1(
              s,
              '  const [isThicknessBlurred, setIsThicknessBlurred] = useState(false);',
              '''  const [isThicknessBlurred, setIsThicknessBlurred] = useState(false);

              const [knaufFillDensity, setKnaufFillDensity] = useState(() =>
                normalizeKnaufFillDensity(initialStructure?.knaufFillDensity)
              );
              const [gratingProfileId, setGratingProfileId] = useState(() =>
                getSteelGratingProfile(initialStructure?.gratingProfileId).id
              );''',
              'engineering states',
          )

          s = sub1(
              s,
              r'      setSelectedType\(typeId\);\n      const th = typeInfo\.isConstantThickness.*?\n      const initFinishLayers =',
              '''      setSelectedType(typeId);
              const initDensity = normalizeKnaufFillDensity(init.knaufFillDensity);
              const initGratingProfile = getSteelGratingProfile(init.gratingProfileId);
              setKnaufFillDensity(initDensity);
              setGratingProfileId(initGratingProfile.id);

              const th = typeId === "steel_grating"
                ? initGratingProfile.height
                : typeInfo.isConstantThickness
                ? typeInfo.defaultThickness
                : (init.thickness ?? typeInfo.defaultThickness);
              setThickness(th);
              setLastValidThickness(th);
              setIsThicknessBlurred(false);

              const initFinishLayers =''',
              'opening engineering init',
              re.S,
          )

          s = sub1(
              s,
              r'      if \(typeInfo\.isConstantThickness\) \{.*?\n      \}\n\n      setPartitionsLoad\(',
              '''      if (typeInfo.isConstantThickness) {
                setDeadLoad(typeInfo.deadLoad);
              } else if (typeId === "monolithic_deck") {
                const finishSum = initFinishLayers.reduce(
                  (sum, l) => sum + (Number(l?.load) || 0),
                  0
                );
                const sComp = getMonolithicDeckStructuralComponents(th);
                setDeadLoad(Math.round((sComp.structuralDeadLoad + finishSum) * 1000) / 1000);
              } else if (typeId === "knauf_dry_floor") {
                setDeadLoad(
                  calculateDeadLoadForType(typeId, th, undefined, {
                    knaufFillDensity: initDensity,
                  })
                );
              } else if (typeId === "steel_grating") {
                setDeadLoad(
                  calculateDeadLoadForType(typeId, initGratingProfile.height, undefined, {
                    gratingProfileId: initGratingProfile.id,
                  })
                );
              } else {
                setDeadLoad(
                  init.deadLoad != null
                    ? init.deadLoad
                    : calculateDeadLoadForType(typeId, th)
                );
              }

              setPartitionsLoad(''',
              'legacy dead-load migration',
              re.S,
          )

          s = sub1(
              s,
              r'  const currentTypeInfo = useMemo\(\(\) => \{.*?\n  \}, \[selectedType\]\);',
              '''  const currentTypeInfo = useMemo(() => {
                return (
                  FLOOR_TYPES.find((t) => t.id === selectedType) || FLOOR_TYPES[0]
                );
              }, [selectedType]);

              const selectedGratingProfile = useMemo(
                () => getSteelGratingProfile(gratingProfileId),
                [gratingProfileId]
              );

              const isDeadLoadComputed =
                currentTypeInfo.isConstantThickness ||
                selectedType === "monolithic_deck" ||
                selectedType === "knauf_dry_floor" ||
                selectedType === "steel_grating";''',
              'current type helpers',
              re.S,
          )

          s = rep1(
              s,
              '  const { isThicknessValid, thicknessErrorMessage } = useMemo(() => {\n    if (currentTypeInfo.isConstantThickness) {',
              '  const { isThicknessValid, thicknessErrorMessage } = useMemo(() => {\n    if (selectedType === "steel_grating") {\n      return { isThicknessValid: true, thicknessErrorMessage: null };\n    }\n    if (currentTypeInfo.isConstantThickness) {',
              'grating thickness validation',
          )
          s = rep1(s, '  }, [currentTypeInfo, thickness, isThicknessBlurred]);', '  }, [currentTypeInfo, selectedType, thickness, isThicknessBlurred]);', 'thickness deps')

          s = sub1(
              s,
              r'  const dynamicLayers = useMemo\(\(\) => \{.*?\n  \}, \[currentTypeInfo, lastValidThickness\]\);',
              '''  const dynamicLayers = useMemo(() => {
                return getLayersForTypeAndThickness(currentTypeInfo, lastValidThickness, {
                  knaufFillDensity,
                  gratingProfileId,
                });
              }, [currentTypeInfo, lastValidThickness, knaufFillDensity, gratingProfileId]);''',
              'dynamic layers',
              re.S,
          )

          s = sub1(
              s,
              r'  const handleTypeSelect = \(typeId\) => \{.*?\n  \};\n\n  // При изменении толщины перекрытия:',
              '''  const handleTypeSelect = (typeId) => {
                setSelectedType(typeId);
                setIsThicknessBlurred(false);
                const info = FLOOR_TYPES.find((t) => t.id === typeId);
                if (info) {
                  if (info.isConstantThickness) {
                    setThickness(info.defaultThickness);
                    setLastValidThickness(info.defaultThickness);
                    setDeadLoad(info.deadLoad);
                  } else if (typeId === "monolithic_deck") {
                    setThickness(info.defaultThickness);
                    setLastValidThickness(info.defaultThickness);
                    const sComp = getMonolithicDeckStructuralComponents(info.defaultThickness);
                    setDeadLoad(Math.round((sComp.structuralDeadLoad + floorFinishLoad) * 1000) / 1000);
                  } else if (typeId === "knauf_dry_floor") {
                    const density = normalizeKnaufFillDensity(knaufFillDensity);
                    setKnaufFillDensity(density);
                    setThickness(info.defaultThickness);
                    setLastValidThickness(info.defaultThickness);
                    setDeadLoad(calculateDeadLoadForType(typeId, info.defaultThickness, undefined, { knaufFillDensity: density }));
                  } else if (typeId === "steel_grating") {
                    const profile = getSteelGratingProfile(gratingProfileId);
                    setGratingProfileId(profile.id);
                    setThickness(profile.height);
                    setLastValidThickness(profile.height);
                    setDeadLoad(calculateDeadLoadForType(typeId, profile.height, undefined, { gratingProfileId: profile.id }));
                  } else {
                    setThickness(info.defaultThickness);
                    setLastValidThickness(info.defaultThickness);
                    setDeadLoad(calculateDeadLoadForType(typeId, info.defaultThickness));
                  }
                }
              };

              // При изменении толщины перекрытия:''',
              'handleTypeSelect',
              re.S,
          )

          s = sub1(
              s,
              r'  const handleThicknessChange = \(newThickness\) => \{.*?\n  \};\n\n  // Выбор пресета полезной нагрузки',
              '''  const handleThicknessChange = (newThickness) => {
                if (selectedType === "steel_grating") return;
                setThickness(newThickness);
                if (currentTypeInfo.isConstantThickness) return;
                if (newThickness === "" || newThickness === null || newThickness === undefined) return;

                const numVal = Number(newThickness);
                const [minT, maxT] = currentTypeInfo.thicknessRange || [0, 9999];
                if (isNaN(numVal) || numVal < minT || numVal > maxT) return;

                setLastValidThickness(numVal);
                if (selectedType === "monolithic_deck") {
                  const sComp = getMonolithicDeckStructuralComponents(numVal);
                  setDeadLoad(Math.round((sComp.structuralDeadLoad + floorFinishLoad) * 1000) / 1000);
                } else if (selectedType === "knauf_dry_floor") {
                  setDeadLoad(calculateDeadLoadForType(selectedType, numVal, undefined, { knaufFillDensity }));
                } else {
                  setDeadLoad(calculateDeadLoadForType(selectedType, numVal));
                }
              };

              const handleKnaufFillDensityChange = (value) => {
                const density = normalizeKnaufFillDensity(value);
                setKnaufFillDensity(density);
                if (selectedType === "knauf_dry_floor") {
                  const thick = Number(lastValidThickness) || currentTypeInfo.defaultThickness || 70;
                  setDeadLoad(calculateDeadLoadForType("knauf_dry_floor", thick, undefined, { knaufFillDensity: density }));
                }
              };

              const handleGratingProfileChange = (profileId) => {
                const profile = getSteelGratingProfile(profileId);
                setGratingProfileId(profile.id);
                setThickness(profile.height);
                setLastValidThickness(profile.height);
                setIsThicknessBlurred(false);
                setDeadLoad(calculateDeadLoadForType("steel_grating", profile.height, undefined, { gratingProfileId: profile.id }));
              };

              // Выбор пресета полезной нагрузки''',
              'engineering change handlers',
              re.S,
          )

          s = rep1(
              s,
              '''    let finalThick = currentTypeInfo.isConstantThickness
                ? currentTypeInfo.defaultThickness
                : Number(thickness);''',
              '''    let finalThick = selectedType === "steel_grating"
                ? selectedGratingProfile.height
                : currentTypeInfo.isConstantThickness
                ? currentTypeInfo.defaultThickness
                : Number(thickness);

              const floorCalcOptions = {
                knaufFillDensity: normalizeKnaufFillDensity(knaufFillDensity),
                gratingProfileId: selectedGratingProfile.id,
              };''',
              'save options',
          )
          count = s.count('calculateDeadLoadForType(currentTypeInfo.id, finalThick)')
          if count != 2:
              raise SystemExit(f'save dead-load calls: expected 2, got {count}')
          s = s.replace('calculateDeadLoadForType(currentTypeInfo.id, finalThick)', 'calculateDeadLoadForType(currentTypeInfo.id, finalThick, undefined, floorCalcOptions)')

          s = rep1(
              s,
              '      responsibilityFactor: safeResponsibilityFactor,\n      standard: currentTypeInfo.standard,',
              '''      responsibilityFactor: safeResponsibilityFactor,
              ...(currentTypeInfo.id === "knauf_dry_floor"
                ? { knaufFillDensity: floorCalcOptions.knaufFillDensity }
                : {}),
              ...(currentTypeInfo.id === "steel_grating"
                ? {
                    gratingProfileId: selectedGratingProfile.id,
                    gratingProfileName: selectedGratingProfile.name,
                    gratingWeight: selectedGratingProfile.gratingWeight,
                  }
                : {}),
              standard: currentTypeInfo.standard,''',
              'save engineering fields',
          )

          s = rep1(s, '                    Толщина перекрытия (мм):', '                    {selectedType === "steel_grating" ? "Тип решётчатого настила:" : "Толщина перекрытия (мм):"}', 'primary label')
          s = rep1(
              s,
              '                  {currentTypeInfo.isConstantThickness ? (',
              '''                  {selectedType === "steel_grating" ? (
                    <div style={{ display: "flex", flexDirection: "column", gap: "8px" }}>
                      <select
                        value={gratingProfileId}
                        onChange={(e) => handleGratingProfileChange(e.target.value)}
                        style={{ width: "100%", padding: "8px 10px", borderRadius: "6px", border: "1px solid #94a3b8", backgroundColor: "#ffffff", color: "#0f172a", fontSize: "0.85em", fontWeight: 600 }}
                      >
                        {STEEL_GRATING_PROFILES.map((profile) => (
                          <option key={profile.id} value={profile.id}>
                            {profile.name} — h={profile.height} мм, {profile.gratingWeight} кг/м²
                          </option>
                        ))}
                      </select>
                      <div style={{ display: "flex", flexWrap: "wrap", gap: "8px 16px", padding: "8px 10px", borderRadius: "6px", backgroundColor: "#ecfdf5", border: "1px solid #a7f3d0", fontSize: "0.78em", color: "#065f46" }}>
                        <span>Высота несущей полосы: <strong>{selectedGratingProfile.height} мм</strong></span>
                        <span>Масса решётки: <strong>{selectedGratingProfile.gratingWeight} кг/м²</strong></span>
                        <span>Второстепенные балки: <strong>22 кг/м²</strong></span>
                        <span>Итого deadLoad: <strong>{deadLoad} кг/м²</strong></span>
                      </div>
                    </div>
                  ) : currentTypeInfo.isConstantThickness ? (''',
              'grating selector UI',
          )

          s = rep1(
              s,
              '                {/* Поля точной корректировки */}',
              '''                {selectedType === "knauf_dry_floor" && (
                  <div style={{ marginBottom: "12px", padding: "10px 12px", borderRadius: "8px", border: "1px solid #c4b5fd", backgroundColor: "#faf5ff" }}>
                    <div style={{ fontSize: "0.8em", fontWeight: 700, color: "#5b21b6", marginBottom: "7px" }}>
                      Расчётная плотность сухой засыпки
                    </div>
                    <div style={{ display: "flex", flexWrap: "wrap", gap: "6px", marginBottom: "6px" }}>
                      {KNAUF_FILL_DENSITY_PRESETS.map((density) => {
                        const isActive = Number(knaufFillDensity) === density;
                        return (
                          <button
                            key={density}
                            type="button"
                            onClick={() => handleKnaufFillDensityChange(density)}
                            style={{ padding: "5px 12px", borderRadius: "5px", border: isActive ? "1.5px solid #7c3aed" : "1px solid #cbd5e1", backgroundColor: isActive ? "#ede9fe" : "#ffffff", color: isActive ? "#6d28d9" : "#334155", fontWeight: isActive ? 700 : 500, cursor: "pointer" }}
                          >
                            {density} кг/м³{density === DEFAULT_KNAUF_FILL_DENSITY ? " (по умолчанию)" : ""}
                          </button>
                        );
                      })}
                    </div>
                    <div style={{ fontSize: "0.75em", color: "#6b21a8" }}>
                      Элемент пола 20 мм: <strong>24 кг/м²</strong> · засыпка {Math.max(0, Number(lastValidThickness) - 20)} мм · профлист: <strong>18 кг/м²</strong> · итог: <strong>{deadLoad} кг/м²</strong>
                    </div>
                  </div>
                )}

                {/* Поля точной корректировки */}''',
              'KNAUF selector UI',
          )
          s = rep1(s, '                      Толщина плиты / настила (мм):', '                      {selectedType === "steel_grating" ? "Высота несущей полосы (мм):" : "Толщина плиты / настила (мм):"}', 'exact label')
          s = rep1(s, '                      disabled={currentTypeInfo.isConstantThickness}\n                      readOnly={currentTypeInfo.isConstantThickness}', '                      disabled={currentTypeInfo.isConstantThickness || selectedType === "steel_grating"}\n                      readOnly={currentTypeInfo.isConstantThickness || selectedType === "steel_grating"}', 'disable grating thickness')
          s = rep1(s, '                      disabled={currentTypeInfo.isConstantThickness || selectedType === "monolithic_deck"}', '                      disabled={isDeadLoadComputed}', 'disable computed deadLoad')

          p.write_text(s, encoding="utf-8")

          # Temporary workflows must not enter final source commit.
          for filename in [".github/workflows/apply-6-14.yml", ".github/workflows/apply-6-14-v2.yml"]:
              f = Path(filename)
              if f.exists():
                  f.unlink()
          PY

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Verify accepted numbers
        shell: bash
        run: |
          python3 - <<'PY'
          def knauf(t, rho):
              return 24 + 18 + max(0, t - 20) / 1000 * rho
          assert knauf(50, 600) == 60
          assert knauf(70, 600) == 72
          assert knauf(100, 600) == 90
          assert knauf(70, 400) == 62
          assert knauf(70, 800) == 82
          weights = {"25x3":23, "30x2":20, "30x3":27, "35x3":31, "40x3":35, "40x4":47}
          assert [v + 22 for v in weights.values()] == [45,42,49,53,57,69]
          print("6.14 acceptance arithmetic passed")
          PY

      - name: Commit patched sources
        shell: bash
        run: |
          git config user.name "ChatGPT 6.14"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(floor): implement KNAUF density and grating profiles [skip ci]"
          git push origin HEAD:chatgpt-6-14
