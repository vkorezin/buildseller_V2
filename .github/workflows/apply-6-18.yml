name: Apply task 6.18 mezzanine floor editor

on:
  push:
    branches:
      - chatgpt-6-18-mezz-floor

permissions:
  contents: write

concurrency:
  group: task-6-18
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source patch
        run: python3 scripts/apply_618.py

      - name: Install dependencies
        shell: bash
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm install --no-save --legacy-peer-deps --no-audit --no-fund ajv@8.17.1 ajv-keywords@5.1.0

      - name: Build
        run: npm run build

      - name: Verify task 6.18 invariants
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          e = Path('src/MezzanineEditor.js').read_text()
          f = Path('src/MezzanineFloorEditor.js').read_text()
          checks = [
              'MezzanineFloorEditor',
              'normalizeMezzanineFloor',
              'responsibilityFactor',
              'Свой пол / пользовательская конструкция',
              'Лист рифлёный — чечевица',
              'Лист рифлёный — ромб',
              'Лист просечно-вытяжной ПВЛ',
              'Сварной решётчатый настил SP 34×38',
              'calculateMezzanineQBase',
              'qDesign',
              'customLayers',
          ]
          for item in checks:
              assert item in (e + f), item
          assert '(p + g + d) * f' not in e
          assert 'Полная расчетная нагрузка = {totalDesignLoad}' not in e
          assert '["406", 15.7]' in f
          assert '["510", 24.7]' in f
          assert '[2.5, 20.1]' in f
          assert '[2.5, 21.0]' in f
          print('6.18 invariants OK')
          PY

      - name: Commit patched sources
        shell: bash
        run: |
          git config user.name "ChatGPT 6.18"
          git config user.email "actions@users.noreply.github.com"
          git add src/MezzanineEditor.js src/MezzanineFloorEditor.js
          git commit -m "feat(mezzanine): add floor constructor and unified loads [skip ci]" || true
          git push
