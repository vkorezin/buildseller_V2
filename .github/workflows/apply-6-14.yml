          s = replace_once(
              s,
              '''  const { isThicknessValid, thicknessErrorMessage } = useMemo(() => {
              if (currentTypeInfo.isConstantThickness) {''',
              '''  const { isThicknessValid, thicknessErrorMessage } = useMemo(() => {
              if (selectedType === "steel_grating") {
                return { isThicknessValid: true, thicknessErrorMessage: null };
              }
              if (currentTypeInfo.isConstantThickness) {''',
