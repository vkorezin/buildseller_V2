                  thickness: 20,
                  weight: 25,
                },
                {
                  name: `Керамзитовая засыпка мелкой фракции (${backfillH} мм)`,
                  thickness: backfillH,
                  weight: backfillWeight,
                  highlight: true,
                },
                {
                  name: "Несущий профлист Н57/Н75",
                  thickness: 75,
                  weight: 18,
                },
              ];
            }''',
              '''  if (typeInfo.id === "knauf_dry_floor") {
              const density = normalizeKnaufFillDensity(options?.knaufFillDensity);
