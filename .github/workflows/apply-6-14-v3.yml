name: Apply task 6.14 v3

on:
  push:
    branches:
      - chatgpt-6-14

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reuse validated patch script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/apply-6-14-v2.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          script = textwrap.dedent(workflow[start:end])
          Path('/tmp/apply_6_14.py').write_text(script, encoding='utf-8')
          PY
          python3 /tmp/apply_6_14.py
          rm -f .github/workflows/apply-6-14-v3.yml

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps --package-lock=false
          npm install --no-save --legacy-peer-deps --package-lock=false ajv@8 ajv-keywords@5

      - name: Build
        run: npm run build

      - name: Verify accepted numbers
        shell: bash
        run: |
          python3 - <<'PY'
          def knauf(t, rho):
              return 24 + 18 + max(0, t - 20) / 1000 * rho
          assert knauf(50, 600) == 60
          assert knauf(70, 600) == 72
          assert knauf(100, 600) == 90
          assert knauf(70, 400) == 62
          assert knauf(70, 800) == 82
          weights = [23, 20, 27, 31, 35, 47]
          assert [v + 22 for v in weights] == [45, 42, 49, 53, 57, 69]
          print('6.14 acceptance arithmetic passed')
          PY

      - name: Commit patched sources
        shell: bash
        run: |
          git config user.name "ChatGPT 6.14"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(floor): implement KNAUF density and grating profiles [skip ci]"
          git push origin HEAD:chatgpt-6-14
