name: Apply task 6.15

on:
  push:
    branches:
      - chatgpt-6-15

permissions:
  contents: write

concurrency:
  group: task-6-15
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source patch
        run: python3 scripts/apply_615.py

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Verify task 6.15 invariants
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          c = Path('src/floorStructureConstants.js').read_text()
          m = Path('src/FloorStructureModal.js').read_text()

          checks = [
              'structuralDeadLoad: 280',
              'floorFinishLoad: 50',
              'structuralDeadLoad: 500',
              'floorFinishLoad: 25',
              'return Math.max(225, Math.round(thick * 2.5 + 50));',
              'floorFinishLayers: hasSeparateFloorFinish ? floorFinishLayers : []',
          ]
          for item in checks:
              assert item in (c + m), item

          assert 280 + 50 == 330
          assert (180 * 2.5 + 50) + 25 == 525
          assert (140 * 2.5 + 50) + 25 == 425
          assert (220 * 2.5 + 50) + 25 == 625
          print('6.15 invariants OK')
          PY

      - name: Commit patched sources
        shell: bash
        run: |
          git config user.name "ChatGPT 6.15"
          git config user.email "actions@users.noreply.github.com"
          git add src/floorStructureConstants.js src/FloorStructureModal.js
          git commit -m "refactor(floor): separate structural and finish loads for RC floors [skip ci]"
          git push
