name: Apply task 6.15

on:
  push:
    branches:
      - chatgpt-6-15

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply 6.15 source changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"{label}: source fragment not found")
              return text.replace(old, new, 1)

          constants_path = Path('src/floorStructureConstants.js')
          c = constants_path.read_text()

          c = replace_once(c,
'''    isConstantThickness: true,
    constantThicknessNote: "Постоянная стандартная заводская толщина 220 мм (ГОСТ 9561-2016)",
    deadLoad: 330, // кг/м²
''',
'''    isConstantThickness: true,
    constantThicknessNote: "Постоянная стандартная заводская толщина 220 мм (ГОСТ 9561-2016)",
    structuralDeadLoad: 280, // кг/м²: плита 230 + замоноличивание 15 + стальные балки 35
    defaultFloorFinishLayers: [
      { name: "Выравнивающая армированная стяжка М150 (30 мм)", load: 50 },
    ],
    floorFinishLoad: 50,
    deadLoad: 330, // кг/м² = structuralDeadLoad 280 + floorFinishLoad 50
''', 'PB metadata')

          c = replace_once(c,
'''    isConstantThickness: false,
    deadLoad: 525, // кг/м² (при t=180мм: 180*2.5 + 25 топпинг + 50 ригели = 525)
''',
'''    isConstantThickness: false,
    structuralDeadLoad: 500, // кг/м² при t=180 мм: плита 450 + главные ригели 50
    defaultFloorFinishLayers: [
      { name: "Топпинг пола / обеспыливающая пропитка (10 мм)", load: 25 },
    ],
    floorFinishLoad: 25,
    deadLoad: 525, // кг/м² = structuralDeadLoad 500 + floorFinishLoad 25
''', 'monolithic slab metadata')

          old_struct = '''export function calculateStructuralDeadLoadForType(typeId, t, options = {}) {
  const thick = Number(t) || 120;
  if (typeId === "monolithic_deck") {
    return getMonolithicDeckStructuralComponents(thick).structuralDeadLoad;
  }
  return calculateDeadLoadForType(typeId, thick, 0, options);
}
'''
          new_struct = '''export function calculateStructuralDeadLoadForType(typeId, t, options = {}) {
  const thick = Number(t) || 120;
  if (typeId === "monolithic_deck") {
    return getMonolithicDeckStructuralComponents(thick).structuralDeadLoad;
  }
  if (typeId === "precast_hollow_core") {
    return 280;
  }
  if (typeId === "monolithic_slab") {
    // Плита тяжелого бетона (2.5 кг/м² на 1 мм) + главные стальные ригели 50 кг/м².
    // Чистовой слой пола учитывается отдельно через floorFinishLoad.
    return Math.max(225, Math.round(thick * 2.5 + 50));
  }
  return calculateDeadLoadForType(typeId, thick, 0, options);
}
'''
          c = replace_once(c, old_struct, new_struct, 'structural function')

          c = replace_once(c,
'''    case "precast_hollow_core":
      // Сборные многопустотные плиты ПК/ПБ - постоянная заводская толщина 220 мм и масса 330 кг/м²
      return 330;
''',
'''    case "precast_hollow_core": {
      const structural = 280;
      const finish =
        floorFinishLoad !== undefined && floorFinishLoad !== null && !isNaN(Number(floorFinishLoad))
          ? Number(floorFinishLoad)
          : 50;
      return Math.round((structural + finish) * 1000) / 1000;
    }
''', 'PB deadLoad formula')

          c = replace_once(c,
'''    case "monolithic_slab":
      // Монолитная плита тяжелого бетона B25 (при t=180мм -> 525 кг/м²: 180*2.5 + 25 топпинг + 50 ригели)
      return Math.max(250, Math.round(thick * 2.5 + 75));
''',
'''    case "monolithic_slab": {
      const structural = Math.max(225, Math.round(thick * 2.5 + 50));
      const finish =
        floorFinishLoad !== undefined && floorFinishLoad !== null && !isNaN(Number(floorFinishLoad))
          ? Number(floorFinishLoad)
          : 25;
      return Math.round((structural + finish) * 1000) / 1000;
    }
''', 'monolithic slab deadLoad formula')

          constants_path.write_text(c)

          modal_path = Path('src/FloorStructureModal.js')
          m = modal_path.read_text()

          old_finish_init = '''    const initFinishLayers =
        Array.isArray(init.floorFinishLayers) && init.floorFinishLayers.length > 0
          ? init.floorFinishLayers
          : init.floorFinishLoad !== undefined && init.floorFinishLoad !== null
          ? [{ name: "Топпинг / покрытие пола", load: Number(init.floorFinishLoad) || 0 }]
          : [{ name: "Топпинг / покрытие пола", load: 15 }];
      setFloorFinishLayers(initFinishLayers);

      if (typeInfo.isConstantThickness) {
      setDeadLoad(typeInfo.deadLoad);
    } else if (typeId === "monolithic_deck") {
'''
          new_finish_init = '''    const defaultFinishLayers = Array.isArray(typeInfo.defaultFloorFinishLayers)
      ? typeInfo.defaultFloorFinishLayers.map((layer) => ({ ...layer }))
      : [];
    const hasSavedFinishLayers =
      Array.isArray(init.floorFinishLayers) && init.floorFinishLayers.length > 0;
    const initFinishLayers = hasSavedFinishLayers
      ? init.floorFinishLayers
      : typeId === "monolithic_deck" &&
        init.floorFinishLoad !== undefined &&
        init.floorFinishLoad !== null
      ? [{ name: "Топпинг / покрытие пола", load: Number(init.floorFinishLoad) || 0 }]
      : defaultFinishLayers;
    setFloorFinishLayers(initFinishLayers);

    const initFloorFinishLoad = initFinishLayers.reduce(
      (sum, layer) => sum + (Number(layer?.load) || 0),
      0
    );

    if (typeId === "precast_hollow_core" || typeId === "monolithic_slab") {
      setDeadLoad(calculateDeadLoadForType(typeId, th, initFloorFinishLoad));
    } else if (typeInfo.isConstantThickness) {
      setDeadLoad(typeInfo.deadLoad);
    } else if (typeId === "monolithic_deck") {
'''
          m = replace_once(m, old_finish_init, new_finish_init, 'modal finish init')

          old_type_select = '''  const handleTypeSelect = (typeId) => {
      setSelectedType(typeId);
      setIsThicknessBlurred(false);
      const info = FLOOR_TYPES.find((t) => t.id === typeId);
      if (info) {
        if (info.isConstantThickness) {
          setThickness(info.defaultThickness);
          setLastValidThickness(info.defaultThickness);
          setDeadLoad(info.deadLoad);
        } else if (typeId === "monolithic_deck") {
          setThickness(info.defaultThickness);
          setLastValidThickness(info.defaultThickness);
          const sComp = getMonolithicDeckStructuralComponents(info.defaultThickness);
          setDeadLoad(Math.round((sComp.structuralDeadLoad + floorFinishLoad) * 1000) / 1000);
'''
          new_type_select = '''  const handleTypeSelect = (typeId) => {
      setSelectedType(typeId);
      setIsThicknessBlurred(false);
      const info = FLOOR_TYPES.find((t) => t.id === typeId);
      if (info) {
        const nextFinishLayers = Array.isArray(info.defaultFloorFinishLayers)
          ? info.defaultFloorFinishLayers.map((layer) => ({ ...layer }))
          : [];
        const nextFinishLoad = nextFinishLayers.reduce(
          (sum, layer) => sum + (Number(layer?.load) || 0),
          0
        );
        setFloorFinishLayers(nextFinishLayers);

        if (typeId === "precast_hollow_core") {
          setThickness(info.defaultThickness);
          setLastValidThickness(info.defaultThickness);
          setDeadLoad(calculateDeadLoadForType(typeId, info.defaultThickness, nextFinishLoad));
        } else if (info.isConstantThickness) {
          setThickness(info.defaultThickness);
          setLastValidThickness(info.defaultThickness);
          setDeadLoad(info.deadLoad);
        } else if (typeId === "monolithic_deck") {
          setThickness(info.defaultThickness);
          setLastValidThickness(info.defaultThickness);
          const sComp = getMonolithicDeckStructuralComponents(info.defaultThickness);
          setDeadLoad(Math.round((sComp.structuralDeadLoad + nextFinishLoad) * 1000) / 1000);
        } else if (typeId === "monolithic_slab") {
          setThickness(info.defaultThickness);
          setLastValidThickness(info.defaultThickness);
          setDeadLoad(calculateDeadLoadForType(typeId, info.defaultThickness, nextFinishLoad));
'''
          m = replace_once(m, old_type_select, new_type_select, 'modal type select')

          m = replace_once(m,
'''      } else if (selectedType === "knauf_dry_floor") {
        setDeadLoad(calculateDeadLoadForType(selectedType, numVal, undefined, { knaufFillDensity }));
      } else {
        setDeadLoad(calculateDeadLoadForType(selectedType, numVal));
      }
''',
'''      } else if (selectedType === "knauf_dry_floor") {
        setDeadLoad(calculateDeadLoadForType(selectedType, numVal, undefined, { knaufFillDensity }));
      } else if (selectedType === "monolithic_slab") {
        setDeadLoad(calculateDeadLoadForType(selectedType, numVal, floorFinishLoad));
      } else {
        setDeadLoad(calculateDeadLoadForType(selectedType, numVal));
      }
''', 'modal slab thickness recalculation')

          old_save = '''    const calculatedStructuralDL =
      currentTypeInfo.id === "monolithic_deck"
        ? getMonolithicDeckStructuralComponents(finalThick).structuralDeadLoad
        : currentTypeInfo.isConstantThickness
        ? currentTypeInfo.deadLoad
        : calculateDeadLoadForType(currentTypeInfo.id, finalThick, undefined, floorCalcOptions);

    const currentFloorFinishLoad =
      currentTypeInfo.id === "monolithic_deck"
        ? floorFinishLayers.reduce((sum, l) => sum + (Number(l?.load) || 0), 0)
        : 0;

    const calculatedDL =
      currentTypeInfo.id === "monolithic_deck"
        ? Math.round((calculatedStructuralDL + currentFloorFinishLoad) * 1000) / 1000
        : currentTypeInfo.isConstantThickness
        ? currentTypeInfo.deadLoad
        : calculateDeadLoadForType(currentTypeInfo.id, finalThick, undefined, floorCalcOptions);
'''
          new_save = '''    const hasSeparateFloorFinish = [
      "monolithic_deck",
      "precast_hollow_core",
      "monolithic_slab",
    ].includes(currentTypeInfo.id);

    const currentFloorFinishLoad = hasSeparateFloorFinish
      ? floorFinishLayers.reduce((sum, l) => sum + (Number(l?.load) || 0), 0)
      : 0;

    const calculatedStructuralDL = hasSeparateFloorFinish
      ? calculateStructuralDeadLoadForType(currentTypeInfo.id, finalThick, floorCalcOptions)
      : currentTypeInfo.isConstantThickness
      ? currentTypeInfo.deadLoad
      : calculateDeadLoadForType(currentTypeInfo.id, finalThick, undefined, floorCalcOptions);

    const calculatedDL = hasSeparateFloorFinish
      ? calculateDeadLoadForType(
          currentTypeInfo.id,
          finalThick,
          currentFloorFinishLoad,
          floorCalcOptions
        )
      : currentTypeInfo.isConstantThickness
      ? currentTypeInfo.deadLoad
      : calculateDeadLoadForType(currentTypeInfo.id, finalThick, undefined, floorCalcOptions);
'''
          m = replace_once(m, old_save, new_save, 'modal save calculations')

          m = replace_once(m,
'''      floorFinishLayers: currentTypeInfo.id === "monolithic_deck" ? floorFinishLayers : [],
''',
'''      floorFinishLayers: hasSeparateFloorFinish ? floorFinishLayers : [],
''', 'modal save finish layers')

          m = replace_once(m,
'''      selectedType === "monolithic_deck" ||
      selectedType === "knauf_dry_floor" ||
''',
'''      selectedType === "monolithic_deck" ||
      selectedType === "monolithic_slab" ||
      selectedType === "knauf_dry_floor" ||
''', 'modal computed deadLoad')

          modal_path.write_text(m)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify task 6.15 invariants
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          c = Path('src/floorStructureConstants.js').read_text()
          m = Path('src/FloorStructureModal.js').read_text()
          required = [
            'structuralDeadLoad: 280',
            'floorFinishLoad: 50',
            'structuralDeadLoad: 500',
            'floorFinishLoad: 25',
            'case "precast_hollow_core": {',
            'case "monolithic_slab": {',
          ]
          for item in required:
            assert item in c, item
          assert '"precast_hollow_core",\n      "monolithic_slab",' in m
          assert 'floorFinishLayers: hasSeparateFloorFinish ? floorFinishLayers : []' in m
          # Default totals must remain unchanged.
          assert 280 + 50 == 330
          assert round(180 * 2.5 + 50) + 25 == 525
          assert round(140 * 2.5 + 50) + 25 == 425
          print('6.15 invariants OK')
          PY

      - name: Commit patched sources
        shell: bash
        run: |
          git config user.name "ChatGPT 6.15"
          git config user.email "actions@users.noreply.github.com"
          git add src/floorStructureConstants.js src/FloorStructureModal.js
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 1
          fi
          git commit -m "refactor(floor): separate structural and finish loads for RC floors [skip ci]"
          git push
