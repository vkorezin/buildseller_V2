name: Apply task 6.15

on:
  push:
    branches:
      - chatgpt-6-15

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply 6.15 source changes
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/apply_615.py
          python3 /tmp/apply_615.py

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify task 6.15 invariants
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          c = Path('src/floorStructureConstants.js').read_text()
          m = Path('src/FloorStructureModal.js').read_text()
          for item in ['structuralDeadLoad: 280', 'floorFinishLoad: 50', 'structuralDeadLoad: 500', 'floorFinishLoad: 25']:
              assert item in c, item
          assert 'floorFinishLayers: hasSeparateFloorFinish ? floorFinishLayers : []' in m
          assert 280 + 50 == 330
          assert round(180 * 2.5 + 50) + 25 == 525
          print('6.15 invariants OK')
          PY

      - name: Commit patched sources
        shell: bash
        run: |
          git config user.name "ChatGPT 6.15"
          git config user.email "actions@users.noreply.github.com"
          git add src/floorStructureConstants.js src/FloorStructureModal.js
          git commit -m "refactor(floor): separate structural and finish loads for RC floors [skip ci]"
          git push
